<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillNova - Best Role Matches</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #312e81);
            min-height: 100vh;
            padding: 30px 15px;
            color: white;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #c4b5fd;
            font-weight: 800;
        }

        .header-text {
            color: #67e8f9;
            font-size: 18px;
            font-weight: 600;
        }

        .best {
            background: white;
            color: #1e293b;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        .best h2 {
            color: #7c3aed;
            margin-bottom: 12px;
        }

        .best-role {
            font-size: 28px;
            font-weight: bold;
            color: #4f46e5;
        }

        .best-description {
            margin-top: 10px;
            color: #64748b;
        }

        .card {
            background: white;
            color: #1e293b;
            padding: 22px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .rank {
            font-size: 20px;
            font-weight: bold;
            color: #7c3aed;
        }

        .role-name {
            font-size: 21px;
            font-weight: bold;
            margin-top: 8px;
            color: #1e293b;
        }

        .score {
            color: #0891b2;
            font-size: 24px;
            font-weight: bold;
            margin-top: 8px;
        }

        .bar-background {
            background: #e2e8f0;
            height: 12px;
            border-radius: 20px;
            margin-top: 12px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: linear-gradient(
                90deg,
                #7c3aed,
                #4f46e5,
                #06b6d4
            );
            border-radius: 20px;
        }

        .button {
            display: block;
            text-align: center;
            text-decoration: none;
            background: linear-gradient(
                90deg,
                #7c3aed,
                #4f46e5
            );
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 20px;
        }

        .button:hover {
            background: linear-gradient(
                90deg,
                #6d28d9,
                #4338ca
            );
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 25px;
            }

            .header-text {
                font-size: 16px;
            }

            .best-role {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>🎯 Best Role Matches</h1>

        <div class="header-text">
            Welcome to SkillNova, find your ultimate goal
        </div>

    </div>


    <!-- BEST ROLE -->

    <div class="best">

        <h2>🏆 Recommended Role</h2>

        <div class="best-role">
            Software Developer
        </div>

        <div class="best-description">
            This role has the highest match with your current skills.
        </div>

    </div>


    <!-- ROLE 1 -->

    <div class="card">

        <div class="rank">
            🥇 Rank 1
        </div>

        <div class="role-name">
            Software Developer
        </div>

        <div class="score">
            92% Match
        </div>

        <div class="bar-background">
            <div class="bar" style="width: 92%;"></div>
        </div>

    </div>


    <!-- ROLE 2 -->

    <div class="card">

        <div class="rank">
            🥈 Rank 2
        </div>

        <div class="role-name">
            Data Analyst
        </div>

        <div class="score">
            84% Match
        </div>

        <div class="bar-background">
            <div class="bar" style="width: 84%;"></div>
        </div>

    </div>


    <!-- ROLE 3 -->

    <div class="card">

        <div class="rank">
            🥉 Rank 3
        </div>

        <div class="role-name">
            UI/UX Designer
        </div>

        <div class="score">
            76% Match
        </div>

        <div class="bar-background">
            <div class="bar" style="width: 76%;"></div>
        </div>

    </div>


    <!-- BUTTON -->

    <a href="/" class="button">
        🔄 Analyze Again
    </a>

</div>

</body>

</html>
