<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1f3c88;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .box,
        .student-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            width: 100%;
            margin-bottom: 10px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn,
        .add-task-btn {
            background: #1f3c88;
            color: white;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-name {
            font-size: 22px;
            font-weight: bold;
        }

        .student-number {
            color: #666;
            margin-top: 5px;
        }

        .stats {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .stat {
            background: #eef2ff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .task-form {
            display: flex;
            gap: 10px;
        }

        .task-form input {
            margin: 0;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-top: 10px;
            background: #f7f8fa;
            border-radius: 8px;
        }

        .task-name {
            flex: 1;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        .complete-btn {
            background: #2e8b57;
            color: white;
        }

        .delete-btn,
        .delete-student {
            background: #d9534f;
            color: white;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            background: #dff6e4;
            color: #18733a;
            border-radius: 7px;
        }

        .empty {
            color: #888;
            font-style: italic;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 25px;
            }

            .container {
                width: 94%;
            }

            .student-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .task-form {
                flex-direction: column;
            }

            .add-task-btn {
                width: 100%;
            }

            .task {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Student Task Manager</h1>
    <p>Manage students and their tasks easily</p>
</header>

<div class="container">

    <div class="box">

        <h2>➕ Add Student</h2>

        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
        >

        <input
            type="text"
            id="studentNumber"
            placeholder="Enter student number"
        >

        <button class="save-btn" onclick="addStudent()">
            Save Student
        </button>

        <div id="message"></div>

    </div>

    <h2>👨‍🎓 Students</h2>

    <div id="students"></div>

</div>


<script>

let students = JSON.parse(localStorage.getItem("students")) || [];


function saveData() {

    localStorage.setItem("students", JSON.stringify(students));

}


function addStudent() {

    let name = document.getElementById("studentName").value.trim();
    let number = document.getElementById("studentNumber").value.trim();

    if (name === "" || number === "") {

        alert("Please enter student name and student number.");

        return;
    }

    students.push({

        id: Date.now(),

        name: name,

        number: number,

        tasks: []

    });

    saveData();

    document.getElementById("studentName").value = "";
    document.getElementById("studentNumber").value = "";

    document.getElementById("message").innerHTML =
        '<div class="message">Student added successfully!</div>';

    displayStudents();

}


function addTask(studentId) {

    let input = document.getElementById("task-" + studentId);

    let taskText = input.value.trim();

    if (taskText === "") {

        alert("Please enter a task.");

        return;
    }

    let student = students.find(function(s) {

        return s.id === studentId;

    });

    student.tasks.push({

        id: Date.now(),

        text: taskText,

        completed: false

    });

    saveData();

    displayStudents();

}


function completeTask(studentId, taskId) {

    let student = students.find(function(s) {

        return s.id === studentId;

    });

    let task = student.tasks.find(function(t) {

        return t.id === taskId;

    });

    task.completed = true;

    saveData();

    displayStudents();

}


function deleteTask(studentId, taskId) {

    let student = students.find(function(s) {

        return s.id === studentId;

    });

    student.tasks = student.tasks.filter(function(t) {

        return t.id !== taskId;

    });

    saveData();

    displayStudents();

}


function deleteStudent(studentId) {

    if (!confirm("Delete this student and all their tasks?")) {

        return;
    }

    students = students.filter(function(s) {

        return s.id !== studentId;

    });

    saveData();

    displayStudents();

}


function displayStudents() {

    let container = document.getElementById("students");

    container.innerHTML = "";

    if (students.length === 0) {

        container.innerHTML =
            '<p class="empty">No students added yet.</p>';

        return;
    }


    students.forEach(function(student) {

        let total = student.tasks.length;

        let completed = student.tasks.filter(function(task) {

            return task.completed;

        }).length;

        let pending = total - completed;


        let card = document.createElement("div");

        card.className = "student-card";


        let tasksHTML = "";


        if (student.tasks.length === 0) {

            tasksHTML =
                '<p class="empty">No tasks added yet.</p>';

        } else {

            student.tasks.forEach(function(task) {

                if (task.completed) {

                    tasksHTML += `

                        <div class="task">

                            <div class="task-name completed">
                                ✅ ${task.text}
                            </div>

                            <button
                                class="delete-btn"
                                onclick="deleteTask(${student.id}, ${task.id})">
                                Delete
                            </button>

                        </div>

                    `;

                } else {

                    tasksHTML += `

                        <div class="task">

                            <div class="task-name">
                                ☐ ${task.text}
                            </div>

                            <button
                                class="complete-btn"
                                onclick="completeTask(${student.id}, ${task.id})">
                                Complete
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteTask(${student.id}, ${task.id})">
                                Delete
                            </button>

                        </div>

                    `;

                }

            });

        }


        card.innerHTML = `

            <div class="student-header">

                <div>

                    <div class="student-name">
                        ${student.name}
                    </div>

                    <div class="student-number">
                        Student No: ${student.number}
                    </div>

                </div>

                <button
                    class="delete-student"
                    onclick="deleteStudent(${student.id})">
                    Delete Student
                </button>

            </div>


            <div class="stats">

                <div class="stat">
                    📋 Total: ${total}
                </div>

                <div class="stat">
                    ✅ Completed: ${completed}
                </div>

                <div class="stat">
                    ⏳ Pending: ${pending}
                </div>

            </div>


            <div class="task-form">

                <input
                    type="text"
                    id="task-${student.id}"
                    placeholder="Enter a new task"
                >

                <button
                    class="add-task-btn"
                    onclick="addTask(${student.id})">
                    Add Task
                </button>

            </div>


            <h3>Tasks</h3>

            ${tasksHTML}

        `;


        container.appendChild(card);

    });

}


displayStudents();

</script>

</body>
</html>
